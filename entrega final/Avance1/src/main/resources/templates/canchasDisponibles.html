<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PadelApp - Canchas Disponibles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #dbe7f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 40px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .app-title {
            color: #1d4e89;
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 0;
        }

        .app-subtitle {
            color: #6c757d;
            font-size: 0.85rem;
            margin-bottom: 30px;
        }

        .canchas-card {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 25px 30px;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .canchas-card h5 {
            color: #1d4e89;
            font-weight: 600;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 12px;
            margin-bottom: 18px;
            font-size: 1.05rem;
        }

        .cancha-item {
            border-bottom: 1px solid #f1f3f5;
            padding-bottom: 14px;
            margin-bottom: 14px;
        }

        .cancha-item:last-of-type {
            border-bottom: none;
        }

        .cancha-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .cancha-nombre {
            font-size: 0.85rem;
            font-weight: 700;
            color: #212529;
            margin-bottom: 2px;
        }

        .cancha-detalle {
            font-size: 0.72rem;
            color: #6c757d;
            margin-bottom: 0;
            line-height: 1.3;
        }

        .badge-disponible {
            background-color: #d1f2dd;
            color: #1e7e42;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
        }

        .badge-ocupada {
            background-color: #fbdada;
            color: #c0392b;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
        }

        .btn-reservar {
            background-color: #2f9e52;
            border: none;
            color: #fff;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 4px 14px;
            margin-top: 6px;
            display: block;
            width: fit-content;
            margin-left: auto;
        }

        .btn-reservar:hover {
            background-color: #26833f;
            color: #fff;
        }

        .btn-no-disponible {
            background-color: #d9dcdf;
            border: none;
            color: #495057;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 4px 14px;
            margin-top: 6px;
            display: block;
            width: fit-content;
            margin-left: auto;
        }

        .btn-volver {
            background-color: #e9ecef;
            border: none;
            color: #333;
            font-weight: 600;
            font-size: 0.82rem;
            width: 100%;
            padding: 9px 12px;
            margin-top: 8px;
            text-align: center;
        }

        .btn-volver:hover {
            background-color: #dcdfe3;
            color: #333;
        }

        .footer-note {
            font-size: 0.7rem;
            color: #9aa5b1;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1 class="app-title">🎾 PadelApp</h1>
    <p class="app-subtitle">Sistema de Reservas de Canchas de Pádel</p>

    <div class="canchas-card">
        <h5>Canchas de pádel</h5>

        <div id="listaCanchas"></div>

        <a th:href="@{/menu}" href="menu.html" class="btn btn-volver">Volver al inicio</a>
    </div>

    <p class="footer-note">Prototipo académico – No hay base de datos ni backend real</p>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const CANCHAS_KEY = 'padelapp_canchas';

        // Datos base: nombre + estado se comparten con el Panel Administrador (localStorage).
        // Capacidad y piso son detalles fijos propios de esta pantalla.
        const detallesCanchas = {
            1: { capacidad: 4, piso: 'Sintético verde' },
            2: { capacidad: 4, piso: 'Cemento azul' },
            3: { capacidad: 4, piso: 'Alfombra profesional' },
            4: { capacidad: 4, piso: 'Sintético rojo' }
        };

        const canchasPorDefecto = [
            { id: 1, nombre: 'Cancha 1 – Techada', estado: 'Disponible' },
            { id: 2, nombre: 'Cancha 2 – Al aire libre', estado: 'Ocupada' },
            { id: 3, nombre: 'Cancha 3 – Premium', estado: 'Disponible' },
            { id: 4, nombre: 'Cancha 4 – Lateral', estado: 'Ocupada' }
        ];

        function cargarCanchas() {
            const guardado = localStorage.getItem(CANCHAS_KEY);
            if (!guardado) {
                localStorage.setItem(CANCHAS_KEY, JSON.stringify(canchasPorDefecto));
                return canchasPorDefecto;
            }
            return JSON.parse(guardado);
        }

        function renderCanchas() {
            const canchas = cargarCanchas();
            const contenedor = document.getElementById('listaCanchas');
            contenedor.innerHTML = '';

            canchas.forEach(c => {
                const detalle = detallesCanchas[c.id] || { capacidad: 4, piso: 'Sintético' };
                const disponible = c.estado === 'Disponible';
                const badgeClase = disponible ? 'badge-disponible' : 'badge-ocupada';

                const boton = disponible
                    ? `<a href="reserva.html?cancha=${encodeURIComponent(c.nombre)}" class="btn btn-reservar">Reservar</a>`
                    : `<button type="button" class="btn btn-no-disponible" disabled>No disponible</button>`;

                const item = document.createElement('div');
                item.className = 'cancha-item';
                item.innerHTML = `
                    <div class="cancha-header">
                        <div>
                            <p class="cancha-nombre">${c.nombre}</p>
                            <p class="cancha-detalle">Capacidad: ${detalle.capacidad} jugadores</p>
                            <p class="cancha-detalle">Piso: ${detalle.piso}</p>
                        </div>
                        <span class="${badgeClase}">${c.estado}</span>
                    </div>
                    ${boton}
                `;
                contenedor.appendChild(item);
            });
        }

        renderCanchas();
    </script>
</body>
</html>
