<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{reserva.tituloPagina}">PadelApp - Nueva Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #dbe7f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 40px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .app-title {
            color: #1d4e89;
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 0;
        }

        .app-subtitle {
            color: #6c757d;
            font-size: 0.85rem;
            margin-bottom: 30px;
        }

        .reserva-card {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 25px 30px;
            width: 100%;
            max-width: 280px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .reserva-card h5 {
            color: #1d4e89;
            font-weight: 600;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 12px;
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        .cancha-seleccionada {
            font-size: 0.78rem;
            color: #495057;
            margin-bottom: 15px;
        }

        .cancha-seleccionada strong {
            color: #1d4e89;
        }

        .form-label {
            font-size: 0.78rem;
            color: #333;
            margin-bottom: 3px;
        }

        .form-control,
        .form-select {
            font-size: 0.82rem;
            padding: 6px 10px;
            margin-bottom: 14px;
        }

        .btn-confirmar {
            background-color: #1d6fa8;
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            width: 100%;
            padding: 8px 0;
            margin-bottom: 8px;
        }

        .btn-confirmar:hover {
            background-color: #175a87;
            color: #fff;
        }

        .btn-cancelar {
            background-color: #e9ecef;
            border: none;
            color: #333;
            font-weight: 600;
            font-size: 0.85rem;
            width: 100%;
            padding: 8px 0;
        }

        .btn-cancelar:hover {
            background-color: #dcdfe3;
            color: #333;
        }

        .footer-note {
            font-size: 0.7rem;
            color: #9aa5b1;
            margin-top: 15px;
            text-align: center;
        }

        .language-selector {
            position: fixed;
            top: 12px;
            right: 15px;
            font-size: 0.72rem;
            color: #9aa5b1;
        }

        .language-selector a {
            color: #1d6fa8;
            text-decoration: none;
            font-weight: 600;
        }

        .language-selector a:hover {
            text-decoration: underline;
        }

        .language-selector span {
            margin: 0 4px;
            color: #c2cad3;
        }
    </style>
</head>
<body>

    <div class="language-selector">
        <a th:href="@{/reserva(lang=es)}">ES</a>
        <span>|</span>
        <a th:href="@{/reserva(lang=en)}">EN</a>
    </div>

    <h1 class="app-title" th:text="#{app.nombre}">🎾 PadelApp</h1>
    <p class="app-subtitle" th:text="#{app.subtitulo}">Sistema de Reservas de Canchas de Pádel</p>

    <div class="reserva-card">
        <h5 th:text="#{reserva.titulo}">Nueva reserva</h5>

        <p class="cancha-seleccionada"><span th:text="#{reserva.canchaSeleccionada}">Cancha seleccionada:</span> <strong id="canchaTexto" th:text="${cancha} ?: 'Cancha 1 – Techada'">Cancha 1 – Techada</strong></p>

        <form th:action="@{/reservas/guardar}" th:object="${reserva}" action="confirmacionReserva.html" method="post" id="formReserva">
            <input type="hidden" id="canchaInput" th:field="*{canchaNombre}" name="canchaNombre" th:value="${cancha} ?: 'Cancha 1 – Techada'" value="Cancha 1 – Techada">

            <label class="form-label" for="fecha" th:text="#{reserva.fecha}">Fecha</label>
            <input type="date" class="form-control" id="fecha" th:field="*{fecha}" name="fecha">

            <label class="form-label" for="hora" th:text="#{reserva.hora}">Hora</label>
            <select class="form-select" id="hora" th:field="*{hora}" name="hora">
                <option value="" selected disabled th:text="#{reserva.horaSeleccionar}">-- Seleccionar hora --</option>
                <option value="08:00">08:00</option>
                <option value="09:00">09:00</option>
                <option value="10:00">10:00</option>
                <option value="11:00">11:00</option>
                <option value="12:00">12:00</option>
                <option value="13:00">13:00</option>
                <option value="14:00">14:00</option>
                <option value="15:00">15:00</option>
                <option value="16:00">16:00</option>
                <option value="17:00">17:00</option>
                <option value="18:00">18:00</option>
                <option value="19:00">19:00</option>
                <option value="20:00">20:00</option>
            </select>

            <label class="form-label" for="jugadores" th:text="#{reserva.jugadores}">Número de jugadores</label>
            <input type="number" class="form-control" id="jugadores" th:field="*{jugadores}" name="jugadores" value="2" min="1">

            <button type="submit" class="btn btn-confirmar" th:text="#{reserva.confirmar}">✔ Confirmar reserva</button>
        </form>

        <a th:href="@{/canchasDisponibles}" href="canchasDisponibles.html" class="btn btn-cancelar" th:text="#{reserva.cancelar}">Cancelar</a>
    </div>

    <p class="footer-note" th:text="#{footer.texto}">Prototipo académico – No hay base de datos ni backend real</p>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
