<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.tituloPagina}">PadelApp - Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #dbe7f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 40px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .app-title {
            color: #1d4e89;
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 0;
        }

        .app-subtitle {
            color: #6c757d;
            font-size: 0.85rem;
            margin-bottom: 30px;
        }

        .login-card {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 30px 35px;
            width: 100%;
            max-width: 270px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .login-card h5 {
            color: #1d4e89;
            font-weight: 600;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 12px;
            margin-bottom: 20px;
            font-size: 1.05rem;
        }

        .form-label {
            font-size: 0.85rem;
            color: #333;
            margin-bottom: 3px;
        }

        .form-control {
            font-size: 0.85rem;
            padding: 6px 10px;
            margin-bottom: 14px;
        }

        .btn-ingresar {
            background-color: #1d6fa8;
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            width: 100%;
            padding: 8px 0;
        }

        .btn-ingresar:hover {
            background-color: #175a87;
            color: #fff;
        }

        .hint-text {
            text-align: center;
            font-size: 0.7rem;
            color: #6c757d;
            margin-top: 12px;
            margin-bottom: 0;
        }

        .footer-note {
            font-size: 0.7rem;
            color: #9aa5b1;
            margin-top: 15px;
            text-align: center;
        }

        .language-selector {
            font-size: 0.75rem;
            color: #6c757d;
            margin-bottom: 18px;
            text-align: center;
        }

        .language-selector a {
            color: #1d6fa8;
            text-decoration: none;
            font-weight: 600;
        }

        .language-selector a:hover {
            text-decoration: underline;
        }

        .language-selector span {
            margin: 0 6px;
            color: #adb5bd;
        }
    </style>
</head>
<body>

    <h1 class="app-title" th:text="#{app.nombre}">🎾 PadelApp</h1>
    <p class="app-subtitle" th:text="#{app.subtitulo}">Sistema de Reservas de Canchas de Pádel</p>

    <div class="language-selector">
        <a th:href="@{/login(lang=es)}">ES</a>
        <span>|</span>
        <a th:href="@{/login(lang=en)}">EN</a>
    </div>

    <div class="login-card">
        <h5 th:text="#{login.titulo}">Iniciar sesión</h5>

        <form th:action="@{/login}" action="login" method="post">
            <label class="form-label" for="usuario" th:text="#{login.usuario}">Usuario</label>
            <input type="text" class="form-control" id="usuario" name="username" th:placeholder="#{login.usuarioPlaceholder}" placeholder="Ej: juan123">

            <label class="form-label" for="password" th:text="#{login.password}">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="•••••">

            <button type="submit" class="btn btn-ingresar" th:text="#{login.ingresar}">Ingresar</button>

            <p class="hint-text" th:text="#{login.hint}">* Cualquier usuario y contraseña funciona (prototipo)</p>
        </form>
    </div>

    <p class="footer-note" th:text="#{footer.texto}">Prototipo académico – No hay base de datos ni backend real</p>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
